name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web release
        run: |
          flutter build web --release \
            --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/"

      - name: Prepare Pages output
        run: |
          # GitHub Pages must not run Jekyll over the output.
          touch build/web/.nojekyll
          # Flutter web uses hash routing, but keep a 404 fallback anyway.
          cp build/web/index.html build/web/404.html
          # Debug symbols are not served to browsers and only bloat the site.
          find build/web -name '*.symbols' -delete
          rm -f build/web/.last_build_id build/web/flutter_service_worker.js

      - uses: actions/configure-pages@v5
        with:
          # Lets the workflow switch Pages on by itself on a fresh repo.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4